<template>
    <lightning-card icon-name="standard:account" title="Account Search">
      <c-account-search-input onsearch={handleSearch}></c-account-search-input>
    </lightning-card>
    <template lwc:if={accList}>
    <lightning-datatable
      key-field="id"
      data={accList}
      columns={columns}
      max-row-selection="1"
      onrowselection={handleRowSelection}
    >
  </lightning-datatable>
    </template>
    <template lwc:else>
      <div class="slds-box slds-theme_warning">
        Please search the accounts.
      </div>
    </template>
</template>
