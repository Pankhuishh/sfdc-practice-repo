<template>
    <div class="slds-box slds-theme_default">
   <lightning-input 
     value={firstName}
     label="First Name"
     onblur={handleFname}
   ></lightning-input>
   <lightning-input 
     value={lastname}
     label="Last Name"
     onblur={handleLname}
   ></lightning-input>
     <lightning-button 
       variant="success"
       label="Launch Flow" 
       onclick={handleClick} 
     ></lightning-button>
     <template lwc:if={isShow}>
     <lightning-flow
       flow-api-name="Display_LWC_Values_In_Flows"
       flow-input-variables={flowInputVariables}
       onstatuschange={handleFlowStatus}
     ></lightning-flow>
     </template>
   </div>
</template>
